# .github/workflows/update-blog-timestamp.yml
name: Update Blog Timestamp

on:
    push: # triggered on push
        branches:
            - staging
            - main
        paths:
            - 'src/content/blog/**'

jobs:
    update-timestamp:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - name: Add missing dates
              run: |
                  # Get current date
                  TODAY=$(date +"%Y-%m-%d")

                  for file in src/content/blog/*.md; do
                    # Skip posts whose frontmatter already has a date key
                    if awk '/^---$/{n++; next} n==1 && /^date:/{found=1} END{exit !found}' "$file"; then
                      continue
                    fi

                    # Insert the date just before the closing frontmatter delimiter
                    awk -v today="$TODAY" '
                      /^---$/ { n++; if (n == 2) print "date: \"" today "\"" }
                      { print }
                    ' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
                    echo "Added date to $file"
                  done

            - name: Commit changes
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  git add src/content/blog
                  # No [skip ci]: Netlify must rebuild with the date, and pushes made with
                  # GITHUB_TOKEN don't retrigger this workflow
                  git diff --quiet && git diff --staged --quiet || git commit -m "Add missing blog dates"
                  git push
